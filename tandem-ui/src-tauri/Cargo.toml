[package]
name = "tandem"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "tandem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2",     features = ["tray-icon"] }
tauri-plugin-shell = { version = "2" }
serde              = { version = "1",     features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1",     features = ["full"] }

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = 3
strip   = true
